<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity UI Options — Metrix.Bar 原生面板与全表面设计探索</title>
  <style>
    :root {
      --agy-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      --agy-font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --agy-bg: #f7f8fa;
      --agy-surface: rgba(255, 255, 255, 0.92);
      --agy-surface-hover: rgba(15, 23, 42, 0.048);
      --agy-surface-pressed: rgba(15, 23, 42, 0.088);
      --agy-border: rgba(15, 23, 42, 0.09);
      --agy-border-strong: rgba(15, 23, 42, 0.16);
      --agy-track: rgba(15, 23, 42, 0.1);
      --agy-pace-tick: rgba(15, 23, 42, 0.65);

      --agy-text: #14171d;
      --agy-muted: #646c7a;
      --agy-accent: #0071e3;
      --agy-accent-subtle: rgba(0, 113, 227, 0.11);
      --agy-accent-text: #ffffff;

      --agy-success: #16a34a;
      --agy-warning: #d97706;
      --agy-danger: #dc2626;
      --agy-success-subtle: rgba(22, 163, 74, 0.11);
      --agy-warning-subtle: rgba(217, 119, 6, 0.12);
      --agy-danger-subtle: rgba(220, 38, 38, 0.12);

      --agy-panel-shadow: 0 18px 48px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(15, 23, 42, 0.08);
    }

    [data-theme="dark"] {
      --agy-bg: #17191f;
      --agy-surface: rgba(255, 255, 255, 0.048);
      --agy-surface-hover: rgba(255, 255, 255, 0.075);
      --agy-surface-pressed: rgba(255, 255, 255, 0.12);
      --agy-border: rgba(255, 255, 255, 0.095);
      --agy-border-strong: rgba(255, 255, 255, 0.18);
      --agy-track: rgba(255, 255, 255, 0.11);
      --agy-pace-tick: rgba(255, 255, 255, 0.8);

      --agy-text: rgba(255, 255, 255, 0.93);
      --agy-muted: rgba(255, 255, 255, 0.54);
      --agy-accent: #4f9eff;
      --agy-accent-subtle: rgba(79, 158, 255, 0.16);
      --agy-accent-text: #ffffff;

      --agy-success: #34d399;
      --agy-warning: #fbbf24;
      --agy-danger: #f87171;
      --agy-success-subtle: rgba(52, 211, 153, 0.14);
      --agy-warning-subtle: rgba(251, 191, 36, 0.14);
      --agy-danger-subtle: rgba(248, 113, 113, 0.16);

      --agy-panel-shadow: 0 22px 56px rgba(0, 0, 0, 0.52), 0 0 0 1px rgba(255, 255, 255, 0.11);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: var(--agy-font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .agy-panel-shell {
      width: 100%;
      background: var(--agy-bg);
      color: var(--agy-text);
      font-family: var(--agy-font-sans);
      font-size: 13px;
      line-height: 1.4;
      border-radius: 14px;
      overflow: hidden;
    }

    .agy-panel-shell button,
    .agy-panel-shell input,
    .agy-panel-shell select {
      font-family: inherit;
    }

    .agy-tnum {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .agy-mono {
      font-family: var(--agy-font-mono);
    }

    @keyframes agy-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .agy-spin {
      animation: agy-spin 900ms linear infinite;
    }

    @keyframes agy-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.92; }
    }

    .agy-skeleton-pulse {
      animation: agy-pulse 1400ms ease-in-out infinite;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root" data-screen-label="Antigravity UI Options 画布"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared-data.jsx"></script>
  <script type="text/babel" src="variant-a.jsx"></script>
  <script type="text/babel" src="variant-b.jsx"></script>
  <script type="text/babel" src="variant-c.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
